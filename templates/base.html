
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}The Daily Journal{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: #faf9f6;
            color: #252525;
            font-family: 'DM Sans', sans-serif;
        }

        .navbar {
            background: white;
            border-bottom: 1px solid #eaeaea;
            padding: 18px 0;
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 27px;
            font-weight: 700;
            color: #222;
            text-decoration: none;
        }

        .nav-link {
            color: #444;
            font-weight: 600;
        }

        .nav-link:hover {
            color: #a36b3f;
        }

        .hero {
            padding: 65px 0 45px;
            text-align: center;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(38px, 6vw, 58px);
            font-weight: 700;
        }

        .hero p {
            color: #777;
            font-size: 17px;
        }

        .post-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 12px;
            overflow: hidden;
            height: 100%;
            transition: 0.25s;
        }

        .post-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.07);
        }

        .post-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .post-card-body {
            padding: 24px;
        }

        .post-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 23px;
        }

        .post-card a {
            color: #222;
            text-decoration: none;
        }

        .read-more {
            color: #a36b3f !important;
            font-weight: 700;
        }

        .article {
            background: white;
            padding: 45px;
            border-radius: 12px;
            border: 1px solid #eee;
        }

        .article h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(32px, 5vw, 48px);
        }

        .article-image {
            width: 100%;
            max-height: 480px;
            object-fit: cover;
            border-radius: 10px;
            margin: 25px 0;
        }

        .article-content {
            font-size: 18px;
            line-height: 1.9;
            white-space: pre-line;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
        }

        .btn-journal {
            background: #252525;
            color: white;
            border-radius: 6px;
            padding: 10px 20px;
        }

        .btn-journal:hover {
            background: #a36b3f;
            color: white;
        }

        footer {
            margin-top: 70px;
            padding: 30px 0;
            background: white;
            border-top: 1px solid #eee;
            color: #777;
            text-align: center;
        }

        @media (max-width: 576px) {
            .article {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="brand" href="{% url 'home' %}">The Daily Journal.</a>

        <div class="ms-auto d-flex align-items-center gap-3">
            {% if user.is_authenticated %}
                <span class="text-muted small">Hi, {{ user.username }}</span>
                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-dark btn-sm">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-dark btn-sm">Login</a>
            {% endif %}
        </div>
    </div>
</nav>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    <div class="container">
        <p class="mb-0">© 2026 The Daily Journal. Built with Django.</p>
    </div>
</footer>

</body>
</html>
